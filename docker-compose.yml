version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: highfive-db
    environment:
      POSTGRES_USER: highfive
      POSTGRES_PASSWORD: highfive123
      POSTGRES_DB: highfive_suite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U highfive -d highfive_suite"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API Backend
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: highfive-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://highfive:highfive123@postgres:5432/highfive_suite
      JWT_SECRET: highfive-super-secret-key-2026
      PORT: 3000
      API_URL: ${API_URL:-http://localhost:3000}
      IYZICO_API_KEY: sandbox-ifkcjkaPdtshoWkt36gjOwpZ9Z5XsUZM
      IYZICO_SECRET_KEY: sandbox-0PfKYCdPshA2ZhqfdGq6JxfB5dXQWeqa
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Resend HTTP API — server ISP blocks outbound 25/465/587, so we relay via api.resend.com
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      HIGHFIVE_MAIL_FROM: ${HIGHFIVE_MAIL_FROM:-info@highfivepps.com}
      HIGHFIVE_MAIL_FROM_NAME: ${HIGHFIVE_MAIL_FROM_NAME:-High Five}
      HIGHFIVE_MAIL_REPLY_TO: ${HIGHFIVE_MAIL_REPLY_TO:-info@highfivepps.com}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID:-}
      WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN:-}
      WA_NOTIFY_PHONE: ${WA_NOTIFY_PHONE:-905552438181}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-xtvJrcUKgsDIQBeIdHOsH6x-iZqqAhB3Xij3UGe9}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # POS Frontend
  pos:
    build:
      context: .
      dockerfile: docker/Dockerfile.pos
    container_name: highfive-pos
    ports:
      - "5501:80"
    depends_on:
      - api
    restart: unless-stopped

  # Kitchen Frontend
  kitchen:
    build:
      context: .
      dockerfile: docker/Dockerfile.kitchen
    container_name: highfive-kitchen
    ports:
      - "5502:80"
    depends_on:
      - api
    restart: unless-stopped

  # Customer Landing Page
  landing:
    build:
      context: .
      dockerfile: docker/Dockerfile.landing
    container_name: highfive-landing
    ports:
      - "5503:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
