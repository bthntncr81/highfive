server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Allow large file uploads (50MB)
    client_max_body_size 50M;

    # API proxy
    location /api {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Uploaded files proxy (^~ gives priority over static file regex)
    location ^~ /uploads {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # QR masa rotası: /table/:id dinamik ve sonsuz → her zaman SPA (200), 404'e düşmesin
    location ^~ /table/ {
        try_files $uri /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA + per-route SEO prerender:
    #   1) tam dosya varsa onu sun (asset, robots.txt, sitemap.xml...)
    #   2) yoksa route'un prerender edilmiş <route>/index.html'i (kendi canonical/title/JSON-LD'si)
    #   3) o da yoksa gerçek HTTP 404 → /404.html (noindex). Soft-404 yok.
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
