# otorder.com — SaaS pazarlama + kayıt/giriş sitesi (tekil host, wildcard DEĞİL).
# Tenant subdomain'leri (*.otorder.com) ayrı server block'larda POS/sipariş sitesine gider.
server {
    listen 80;
    server_name otorder.com www.otorder.com;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Platform API proxy (kayıt/plan/abonelik/süper-admin)
    location /api {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA (react-router): /signup, /login client-side
    location / {
        try_files $uri /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
